<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trang web của tôi</title>

    <style>

        body {

            background: #ffe4ec;

            font-family: Arial, sans-serif;

            text-align: center;

            padding-top: 100px;

        }

        .container {

            background: white;

            padding: 35px;

            margin: 20px;

            border-radius: 20px;

        }

        h1 {

            color: #ff6699;

        }

        button {

            background: #ff6699;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 20px;

            cursor: pointer;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Xin chào! 💗</h1>

        <p>Chào mừng bạn đến với trang web của tôi.</p>

        <button onclick="alert('Chúc bạn một ngày vui vẻ! 💕')">

            Nhấn vào đây

        </button>

    </div>

</body>

</html>
